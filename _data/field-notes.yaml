# Field Notes Gallery - Animal Photography Catalog
# Images are randomized for variety on each visit
#
# Per-image fields:
#   filename       (required)  file in Field_Notes_Images/
#   alt            (required)  alt text for the <img>
#   aspect_ratio   (optional)  opt-in: show the FULL image inside the
#                              standard 4:5 tile (no cropping), with
#                              aged-white letterbox bars above/below.
#                              Use for images whose composition would
#                              be hurt by edge cropping. Any truthy
#                              value triggers it (e.g. "landscape",
#                              "4/3", true) — the value itself is a
#                              hint for future readers, not applied.

